name: Deploy Event Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare local test configuration
        run: node -e "require('fs').writeFileSync('.dev.vars', 'LOCAL_DEV=true\nADMIN_TOKEN=local-development-only-not-for-production\n')"
      # GitHub's Ubuntu image already includes Chromium system libraries.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - name: Verify public deployment settings
        run: node -e "if (!process.env.VITE_API_URL?.startsWith('https://') || !process.env.VITE_TURNSTILE_SITE_KEY) throw new Error('Set repository variables VITE_API_URL and VITE_TURNSTILE_SITE_KEY before deployment')"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node -e "if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error('Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions Secrets')"
      - name: Apply production database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run api:deploy
      - name: Verify production API
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: node -e "fetch(process.env.VITE_API_URL + '/api/health', {signal:AbortSignal.timeout(15000)}).then(async r => {if (!r.ok || !(await r.json()).ok) throw new Error('Production API health check failed')}).catch(e => {console.error(e.message);process.exit(1)})"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
